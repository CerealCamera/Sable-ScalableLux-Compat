modLoader="javafml"
loaderVersion="[4,)"
issueTrackerURL = "${issue_tracker_url}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="CerealCamera"
description='''Fixes compatibility between Sable and ScalableLux!'''
displayURL = "${display_url}"
updateJSONURL = "${update_url}"
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config="${mod_id}.mixins.json"
requiredMods=["scalablelux"]

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="scalablelux"
    type="incompatible"
    reason="Must be launched once without ScalableLux in order to add dependency overrides!"
